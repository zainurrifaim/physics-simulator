<svg xmlns="http://www.w3.org/2000/svg" width="220" height="240" viewBox="0 0 220 240" role="img" aria-labelledby="title desc">
  <title id="title">Simple fixed pulley</title>
  <desc id="desc">A fixed pulley attached to a ceiling support, with a downward force arrow on the left and a hanging mass on the right.</desc>
  <g fill="none" stroke="#303030" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ceiling and attachment -->
    <rect x="31" y="17" width="158" height="20" rx="2" fill="#fff"/>
    <path d="M110 37 V51"/>
    <rect x="96" y="51" width="28" height="16" rx="2" fill="#fff"/>
    <!-- Wheel -->
    <circle cx="110" cy="116" r="47" fill="#fff"/>
    <circle cx="110" cy="116" r="14"/>
    <!-- Rope ends -->
    <path d="M63 116 V177"/>
    <path d="M157 116 V177"/>
    <!-- Downward applied force arrow -->
    <path d="M50 177 H76 L63 198 Z" fill="#fff"/>
    <!-- Suspended block -->
    <rect x="139" y="177" width="36" height="43" fill="#fff"/>
  </g>
</svg>
